name: evaluate
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Semantic model versions to evaluate, in order"
        default: "v1 v2 v3"
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run golden set
        env:
          PYTHONUNBUFFERED: "1"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          ASK_PULSE_MODEL: ${{ vars.ASK_PULSE_MODEL }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          python -m askpulse.semantic
          for v in $VERSIONS; do python -m evals.run --semantic "$v" --tag "$v"; done
          python -m evals.report
      - name: Save results
        if: always()
        run: |
          cat evals/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results evals/RESULTS.md docs/results.json
          git commit -m "eval: $VERSIONS" || echo "no changes"
          git pull --rebase origin main && git push
        env:
          VERSIONS: ${{ inputs.versions }}
